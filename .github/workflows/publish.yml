name: Publish RDX

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prepared RDX version on main (for example, 5.0.0)
        required: true
        type: string
      publish:
        description: Publish missing packages to npm (unchecked is a dry run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rdx-npm-publish
  cancel-in-progress: false

env:
  HUSKY: '0'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  pack:
    if: github.repository == 'lexibase/rdx' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Require successful CI on this commit
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --json conclusion --jq 'any(.[]; .conclusion == "success")')
          if [[ "$passed" != true ]]; then
            echo 'Wait for CI to pass on this main commit before publishing.' >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter='./packages/*'
      - name: Pack and check the release
        run: |
          pnpm release:pack "$RELEASE_VERSION" "$RUNNER_TEMP/rdx-archives"
          node scripts/publish-release.mjs dry-run "$RELEASE_VERSION" "$RUNNER_TEMP/rdx-archives"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rdx-npm-archives
          path: ${{ runner.temp }}/rdx-archives/*.tgz
          if-no-files-found: error
          retention-days: 3

  publish:
    if: inputs.publish && github.repository == 'lexibase/rdx' && github.ref == 'refs/heads/main'
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rdx-npm-archives
          path: ${{ runner.temp }}/rdx-archives
      - name: Publish verified archives in dependency order
        run: node scripts/publish-release.mjs publish "$RELEASE_VERSION" "$RUNNER_TEMP/rdx-archives"
