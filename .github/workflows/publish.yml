name: Publish RDX

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prepared RDX version on main (for example, 5.0.0)
        required: true
        type: string
      publish:
        description: Publish missing packages to npm (unchecked is a dry run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rdx-npm-publish
  cancel-in-progress: false

env:
  HUSKY: '0'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  pack:
    if: github.repository == 'lexibase/rdx' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Wait for successful CI on this commit
        if: inputs.publish
        timeout-minutes: 36
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 35 * 60))
          ci_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/ci.yml?query=branch%3Amain"
          last_status=''
          while (( SECONDS < deadline )); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch main --commit "$GITHUB_SHA" --event push --limit 1 \
              --json status,conclusion,url \
              --jq '.[] | [.status, (.conclusion // ""), .url] | join("|")')
            IFS='|' read -r status conclusion url <<< "$run"
            ci_url=${url:-$ci_url}

            if [[ "$status" == completed ]]; then
              if [[ "$conclusion" == success ]]; then
                echo "CI passed for $GITHUB_SHA: $ci_url"
                exit 0
              fi
              echo "CI finished with ${conclusion:-an unknown result} for $GITHUB_SHA: $ci_url" >&2
              exit 1
            fi

            status=${status:-not yet registered}
            if [[ "$status" != "$last_status" ]]; then
              echo "Waiting for CI ($status) for $GITHUB_SHA: $ci_url"
              last_status=$status
            fi
            sleep 15
          done
          echo "Timed out waiting for CI on $GITHUB_SHA: $ci_url" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter='./packages/*'
      - name: Pack and check the release
        run: |
          pnpm release:pack "$RELEASE_VERSION" "$RUNNER_TEMP/rdx-archives"
          node scripts/publish-release.mjs dry-run "$RELEASE_VERSION" "$RUNNER_TEMP/rdx-archives"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rdx-npm-archives
          path: ${{ runner.temp }}/rdx-archives/*.tgz
          if-no-files-found: error
          retention-days: 3

  publish:
    if: inputs.publish && github.repository == 'lexibase/rdx' && github.ref == 'refs/heads/main'
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rdx-npm-archives
          path: ${{ runner.temp }}/rdx-archives
      - name: Publish verified archives in dependency order
        run: node scripts/publish-release.mjs publish "$RELEASE_VERSION" "$RUNNER_TEMP/rdx-archives"
